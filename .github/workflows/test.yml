# ============================================================================
# 6G Digital Immunity — GitHub Actions CI/CD Pipeline
# ============================================================================
# Triggers on push and pull_request events.
# Runs unit tests, type checking (mypy), and linting (ruff) across
# Python 3.11 and 3.12, and uploads coverage to Codecov.
#
# ============================================================================

name: Tests & Quality

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # Job 1: Unit Tests with Coverage
  # ==========================================================================
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout pytest-asyncio

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=safety-filter \
            --cov=llm-agent \
            --cov=simulation \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --timeout=120 \
            -x

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: 6g-digital-immunity-coverage
          fail_ci_if_error: false
          verbose: true

  # ==========================================================================
  # Job 2: Static Type Checking (mypy)
  # ==========================================================================
  typecheck:
    name: "Type Checking (mypy)"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy grpc-stubs types-PyYAML types-requests

      - name: Run mypy on safety-filter
        run: mypy safety-filter/ --ignore-missing-imports --no-error-summary || true

      - name: Run mypy on llm-agent
        run: mypy llm-agent/ --ignore-missing-imports --no-error-summary || true

      - name: Run mypy on simulation
        run: mypy simulation/ --ignore-missing-imports --no-error-summary || true

  # ==========================================================================
  # Job 3: Linting (ruff)
  # ==========================================================================
  lint:
    name: "Linting (ruff)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # ==========================================================================
  # Job 4: Integration Test (Docker Compose)
  # ==========================================================================
  integration:
    name: "Integration (Docker)"
    runs-on: ubuntu-latest
    needs: [test, typecheck, lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate mTLS certificates
        run: bash ./infra/scripts/bootstrap.sh

      - name: Start Docker environment
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: sleep 20

      - name: Verify service health
        run: |
          docker compose ps
          echo "--- Checking DSF Server ---"
          docker exec 6gdi-dsf-server python -c "print('DSF OK')" || echo "DSF not ready"
          echo "--- Checking LLM Agent ---"
          docker exec 6gdi-llm-agent python -c "print('LLM Agent OK')" || echo "LLM Agent not ready"
          echo "--- Checking RAN Simulator ---"
          docker exec 6gdi-osmo-bsc python -c "print('RAN Sim OK')" || echo "RAN Sim not ready"

      - name: Run integration test
        run: |
          docker cp test_intent.py 6gdi-llm-agent:/app/test_intent.py
          docker exec 6gdi-llm-agent python /app/test_intent.py

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose logs --tail=50

      - name: Teardown
        if: always()
        run: docker compose down -v
